<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lily Abroad</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
  <header class="site-header">
    <button id="topEditBtn" class="top-edit-button">Edit Travel Path</button>
    <nav>
      <ul class="nav-list">
        <li><a href="#map" class="tab-link active" data-tab="map">Map</a></li>
      </ul>
      <select id="mobileNav" class="mobile-nav" aria-label="Navigate tabs">
        <option value="map">Map</option>
      </select>
    </nav>
  </header>

  <main>
    <section id="map" class="tab-panel active">
      <div class="map-container">
        <div id="mapid"></div>
        <div class="map-controls">
          <button id="previousFlight" type="button" aria-label="Previous travel leg">Previous</button>
          <button id="playFlights">Play</button>
          <button id="nextFlight" type="button" aria-label="Next travel leg">Next</button>
        </div>
        <div class="map-bottom-bar">
          <div class="transport-display">Now playing: <span id="currentTransport" aria-live="polite">—</span></div>
          <input id="progressSlider" type="range" min="0" max="100" value="0">
        </div>
      </div>
      <!-- Timeline below the map -->
      <div id="timeline" class="timeline" aria-label="travel timeline"></div>
    </section>

    <section id="edit" class="tab-panel">
      <div class="editor">
        <div class="editor-heading">
          <h2>Edit Travel Path / Saved Travel Paths</h2>
          <button id="backToMapBtn" type="button">Back to Map</button>
        </div>
        <div style="margin-bottom:12px;display:flex;gap:8px;align-items:center;">
          <button id="downloadFlightsBtn" type="button" style="background:var(--brown-1);color:var(--text-light);border:none;padding:8px 12px;border-radius:6px">Download Flights</button>
          <button id="uploadFlightsBtn" type="button" style="background:var(--brown-2);color:var(--text-light);border:none;padding:8px 12px;border-radius:6px">Upload Flights</button>
          <input id="uploadFlightsInput" type="file" accept="application/json,.json" hidden>
        </div>
        <form id="flightForm">
          <label>From Airport Code:
            <span class="airport-lookup-row">
              <input name="fromAirportCode" maxlength="3" placeholder="e.g. ORD" autocomplete="off">
              <button type="button" id="lookupFromAirport">Find</button>
            </span>
          </label>
          <label>From (city): <input name="from" required></label>
          <label>To Airport Code:
            <span class="airport-lookup-row">
              <input name="toAirportCode" maxlength="3" placeholder="e.g. BCN" autocomplete="off">
              <button type="button" id="lookupToAirport">Find</button>
            </span>
          </label>
          <label>To (city): <input name="to" required></label>
          <label>Type:
            <select name="type">
              <option value="flight">Flight</option>
              <option value="drive">Drive</option>
              <option value="train">Train</option>
              <option value="boat">Boat</option>
            </select>
          </label>
          <label>Date: <input name="date" type="date"></label>
          <label>End Date (optional): <input name="endDate" type="date"></label>
          <label>From Lat,Lon: <input name="fromCoords" placeholder="lat,lon" required></label>
          <label>To Lat,Lon: <input name="toCoords" placeholder="lat,lon" required></label>
          <button type="submit" id="submitBtn">Add</button>
          <button type="button" id="cancelEdit" style="display:none;margin-left:8px;">Cancel</button>
          <div id="airportLookupStatus" class="airport-lookup-status" role="status" aria-live="polite"></div>
        </form>
        <div class="airport-data-credit">Airport lookup data © OpenStreetMap contributors</div>
        <h3>Saved Travel Paths</h3>
        <ul id="flightsList"></ul>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
